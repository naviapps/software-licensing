[workspace]
members = ["crates/core", "crates/ffi", "crates/windows"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
repository = "https://github.com/naviapps/software-licensing"
rust-version = "1.99"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
software-licensing = { path = "crates/core" }
software-licensing-windows = { path = "crates/windows" }
unicode-general-category = "1"
zeroize = { version = "1", features = ["derive"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "none"
